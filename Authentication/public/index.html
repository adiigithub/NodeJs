<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Website</title>
  </head>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    async function signup() {
      const username = document.getElementById("signup-username").value;
      const password = document.getElementById("signup-password").value;

      await axios.post("http://localhost:4444/signup", {
        username: username,
        password: password,
      });
      alert("you are signup");

      document.getElementById("signup-section").style.display = "none";
      document.getElementById("signin-section").style.display = "block";
    }
    async function signin() {
      const username = document.getElementById("signin-username").value;
      const password = document.getElementById("signin-password").value;

      const response = await axios.post("http://localhost:4444/signin", {
        username: username,
        password: password,
      });
      localStorage.setItem("token", response.data.token);
      alert("you are signin");
    }
    async function getUserInformation() {
      const response = await axios.get("http://localhost:4444/me", {
        headers: {
          token: localStorage.getItem("token"),
        },
      });
      document.getElementById("information").innerHTML =
        "Username:" +
        response.data.username +
        "Password:" +
        response.data.password;
    }
    if (localStorage.getItem("token")) {
      getUserInformation();
    }

    function logout() {
      localStorage.removeItem("token");
      alert("you are logout");

      document.getElementById("signup-section").style.display = "block";
      document.getElementById("signin-section").style.display = "none";
      document.getElementById("information").innerHTML = "";
    }
  </script>
  <body>
    <div id="signup-section">
      <h3>Signup</h3>
      <input id="signup-username" type="text" placeholder="username" />
      <input id="signup-password" type="password" placeholder="password" />
      <button onclick="signup()">Submit</button>
    </div>

    <div id="signin-section" style="display: none">
      <h3>Signin</h3>
      <input id="signin-username" type="text" placeholder="username" />
      <input id="signin-password" type="password" placeholder="password" />
      <button onclick="signin()">Submit</button>
    </div>
    <div>
      User Infrmation
      <div id="information"></div>
    </div>
    <div>
      <button onclick="logout()">logout</button>
    </div>
  </body>
</html>
